[package]
name = "system-monitor"
version = "0.1.0"
edition = "2021"
description = "A terminal task manager for Omarchy"
license = "MIT"

[dependencies]
anyhow = "1"
nix = { version = "0.29", features = ["signal"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
